[project]
name = "lc0ex"
version = "0.1.0"
description = "Linker for Lc0 neural executables"
requires-python = ">=3.13"
dependencies = ["protobuf>=7.35.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc0ex"]

[tool.hatch.build.targets.wheel.force-include]
"src/lc0ex_pb2.py" = "lc0ex_pb2.py"
"src/lc0ex_pb2.pyi" = "lc0ex_pb2.pyi"
"src/module_manifest_pb2.py" = "module_manifest_pb2.py"
"src/module_manifest_pb2.pyi" = "module_manifest_pb2.pyi"

[tool.hatch.build.targets.sdist.force-include]
"src/lc0ex_pb2.py" = "src/lc0ex_pb2.py"
"src/lc0ex_pb2.pyi" = "src/lc0ex_pb2.pyi"
"src/module_manifest_pb2.py" = "src/module_manifest_pb2.py"
"src/module_manifest_pb2.pyi" = "src/module_manifest_pb2.pyi"
