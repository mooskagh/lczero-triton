[project]
name = "lczero-triton"
version = "0.1.0"
description = "Lc0-specific Triton kernels and graph construction commands"
requires-python = ">=3.13"
dependencies = [
    "lc0ex",
    "torch>=2.13",
    "triton>=3.7,<3.8",
]

[project.scripts]
lczero-triton = "lczero_triton.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lczero_triton"]

[tool.uv.sources]
lc0ex = { workspace = true }
