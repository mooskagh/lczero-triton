[project]
name = "lczero-triton-workspace"
version = "0.1.0"
description = "Workspace for Lc0 graph construction and Triton kernel compilation"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "types-protobuf>=7.34.1.20260518",
]

[tool.uv.workspace]
members = [
    "packages/lc0ex",
    "packages/lczero-triton",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
    "packages/lc0ex/src/*_pb2.py",
    "packages/lczero-triton/typings",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "CPY001", # The repository has no copyright-header policy.
    "D203",   # Use D211: no blank line before class docstrings.
    "D213",   # Use D212: summary starts on the first docstring line.
]

[tool.ruff.lint.per-file-ignores]
"packages/lc0ex/src/lc0ex/triton_module_compiler.py" = [
    "ANN401", # Triton's compiled-kernel API is intentionally unchecked.
]
"packages/**/tests/**/*.py" = [
    "S101", # Assertions are the idiomatic pytest API.
    "INP001", # Test directories are discovered by pytest.
]
"packages/lczero-triton/src/lczero_triton/kernels/**/*.py" = [
    "PLR0913", # Triton kernels expose their explicit device ABI.
    "PLR0917", # Triton kernels expose their explicit device ABI.
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages"]
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "redundant-expr",
]
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["lczero_triton.kernels.matmul"]
disable_error_code = [
    "import-untyped", # Triton does not provide typing information.
    "untyped-decorator", # Triton's decorators consequently remain untyped.
]

[[tool.mypy.overrides]]
module = [
    "lc0ex_pb2",
    "module_manifest_pb2",
]
disable_error_code = ["type-arg"] # grpcio-tools emits bare Mapping types.

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = [
    "packages/lc0ex/src",
    "packages/lczero-triton/src",
]
testpaths = [
    "packages/lc0ex/tests",
    "packages/lczero-triton/tests",
]
