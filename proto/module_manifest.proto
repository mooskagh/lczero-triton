syntax = "proto2";

package pblczero;

import "lc0ex.proto";

// Runtime information for one compiled device module.
message ModuleManifest {
  message Kernel {
    required string name = 1;
    required string function = 2;
    repeated ParameterType parameters = 3;

    // Dimensions are in x, y, z order and must contain exactly three values.
    repeated uint32 grid = 4;
    repeated uint32 block = 5;
    optional uint32 dynamic_shared_memory_bytes = 6 [default = 0];
  }

  required uint32 format = 1;
  required string name = 2;

  // Resolved relative to the manifest file by the linker.
  required string binary_path = 3;
  required Binary.Format binary_format = 4;
  required Target target = 5;

  repeated Kernel kernels = 10;
}
