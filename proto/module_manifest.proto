syntax = "proto2";

package pblczero;

import "lc0ex.proto";

// Runtime information for one compiled device module.
message ModuleManifest {
  message Kernel {
    required string function = 1;
    repeated ParameterType parameters = 2;

    // Dimensions are in x, y, z order and must contain exactly three values.
    repeated uint32 grid = 3;
    repeated uint32 block = 4;
    optional uint32 dynamic_shared_memory_bytes = 5 [default = 0];
  }

  message Symbol {
    required string symbol_name = 1;
  }

  required uint32 format = 1;

  // Resolved relative to the manifest file by the linker.
  required string binary_path = 2;
  required Binary.Format binary_format = 3;
  required Target target = 4;

  repeated Kernel kernels = 10;
  repeated Symbol symbols = 11;
}
